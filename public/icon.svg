<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#121118"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    
    <!-- Neon V Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a54"/>
      <stop offset="50%" stop-color="#9842ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    
    <!-- Shadow Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Maskable background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.15"/>
  
  <!-- Stylized logo letter V -->
  <g filter="url(#glow)">
    <path d="M140 120 L220 380 Q235 410 256 410 Q277 410 292 380 L372 120" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Decorative dot -->
    <circle cx="256" cy="250" r="18" fill="#ffffff" filter="drop-shadow(0 0 8px #00e5ff)"/>
  </g>
</svg>
